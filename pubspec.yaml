name: secure_chat
description: SecureChat - A production-ready chat application
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Networking
  dio: ^5.3.3
  web_socket_channel: ^2.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # File Handling
  image_picker: ^1.0.4
  file_picker: ^10.3.10
  path_provider: ^2.1.1
  
  # Media
  video_player: ^2.7.2
  audioplayers: ^5.2.1
  chewie: ^1.7.4
  
  # UI Components
  cached_network_image: ^3.3.0
  photo_view: ^0.14.0
  flutter_sound: ^9.2.13
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1
  mime: ^1.0.4
  http_parser: ^4.0.2
  
  # Security
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  convert: ^3.1.2
  fixnum: ^1.1.0
  pointycastle: ^4.0.0

  # Contacts
  contacts_service:
    path: plugins/contacts_service
  permission_handler: ^11.0.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  libsignal_protocol_dart: ^0.8.2

  # WebRTC (voice/video calls)
  flutter_webrtc: ^1.6.0

  # Firebase (push notifications + authentication)
  firebase_messaging: ^16.5.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  flutter_image_compress: ^2.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-latin-400-normal.ttf
          weight: 400
        - asset: assets/fonts/Inter-latin-500-normal.ttf
          weight: 500
        - asset: assets/fonts/Inter-latin-600-normal.ttf
          weight: 600
        - asset: assets/fonts/Inter-latin-700-normal.ttf
          weight: 700
