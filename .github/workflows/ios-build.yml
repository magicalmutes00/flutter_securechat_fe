name: Flutter iOS Build

on:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.0

      - name: Flutter pub get
        run: flutter pub get

      - name: Pod install
        run: cd ios && pod install

      # `flutter build ipa --no-codesign` only produces the .xcarchive — the
      # export step always requires signing, so no .ipa would exist. Build the
      # unsigned .app and package it into an IPA by hand instead.
      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry Runner.ipa Payload
          ls -lh Runner.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/Runner.ipa
